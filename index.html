<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Card</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 36px 32px 28px;
      color: #fff;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.05);
      min-width: 0;
    }

    .location-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 28px;
    }

    .pin-icon {
      font-size: 14px;
      opacity: 0.7;
    }

    .city-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .weather-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .temperature-display {
      line-height: 1;
    }

    .temp-value {
      font-size: 88px;
      font-weight: 200;
      letter-spacing: -4px;
      line-height: 1;
    }

    .temp-unit {
      font-size: 32px;
      font-weight: 300;
      vertical-align: super;
      margin-left: 2px;
      opacity: 0.8;
    }

    .condition-icon {
      font-size: 72px;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
      transition: transform 0.3s ease;
    }

    .condition-icon:hover { transform: scale(1.08); }

    .condition-label {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 0.02em;
      opacity: 0.9;
      margin-bottom: 28px;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 20px;
    }

    .hi-lo {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 28px;
    }

    .hi-lo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .hi-lo-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .hi-lo-value {
      font-size: 22px;
      font-weight: 400;
    }

    .hi-lo-value.high { color: #fbbf24; }
    .hi-lo-value.low  { color: #93c5fd; }

    .toggle-btn {
      width: 100%;
      padding: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .toggle-btn:active { transform: scale(0.98); }

    .temp-value,
    .hi-lo-value {
      transition: opacity 0.2s ease;
    }

    .fade {
      opacity: 0;
    }

    @media (max-width: 400px) {
      .card { padding: 28px 22px 22px; }
      .temp-value { font-size: 72px; }
      .condition-icon { font-size: 56px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="location-row">
    <span class="pin-icon">📍</span>
    <span class="city-name" id="cityName">New York</span>
  </div>

  <div class="weather-main">
    <div class="temperature-display">
      <span class="temp-value" id="currentTemp">22</span><span class="temp-unit" id="unitLabel">°C</span>
    </div>
    <span class="condition-icon" id="conditionIcon">☀️</span>
  </div>

  <div class="condition-label" id="conditionLabel">Sunny</div>

  <hr class="divider" />

  <div class="hi-lo">
    <div class="hi-lo-item">
      <span class="hi-lo-label">High</span>
      <span class="hi-lo-value high" id="highTemp">26°</span>
    </div>
    <div class="hi-lo-item">
      <span class="hi-lo-label">Low</span>
      <span class="hi-lo-value low" id="lowTemp">17°</span>
    </div>
  </div>

  <button class="toggle-btn" id="toggleBtn" onclick="toggleUnit()">Switch to °F</button>
</div>

<script>
  const data = {
    city: 'New York',
    condition: 'Sunny',
    emoji: '☀️',
    celsius: { current: 22, high: 26, low: 17 }
  };

  let isCelsius = true;

  function toF(c) { return Math.round(c * 9 / 5 + 32); }

  function toggleUnit() {
    isCelsius = !isCelsius;

    const tempEls = [
      document.getElementById('currentTemp'),
      document.getElementById('highTemp'),
      document.getElementById('lowTemp')
    ];

    tempEls.forEach(el => el.classList.add('fade'));

    setTimeout(() => {
      if (isCelsius) {
        document.getElementById('currentTemp').textContent = data.celsius.current;
        document.getElementById('highTemp').textContent   = data.celsius.high + '°';
        document.getElementById('lowTemp').textContent    = data.celsius.low  + '°';
        document.getElementById('unitLabel').textContent  = '°C';
        document.getElementById('toggleBtn').textContent  = 'Switch to °F';
      } else {
        document.getElementById('currentTemp').textContent = toF(data.celsius.current);
        document.getElementById('highTemp').textContent    = toF(data.celsius.high) + '°';
        document.getElementById('lowTemp').textContent     = toF(data.celsius.low)  + '°';
        document.getElementById('unitLabel').textContent   = '°F';
        document.getElementById('toggleBtn').textContent   = 'Switch to °C';
      }
      tempEls.forEach(el => el.classList.remove('fade'));
    }, 180);
  }
</script>

</body>
</html>
