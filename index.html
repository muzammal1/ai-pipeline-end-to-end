<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Card</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      min-width: 0;
      color: #fff;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .city {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 4px;
    }

    .date {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 28px;
    }

    .condition-emoji {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 12px;
      display: block;
    }

    .condition-label {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 20px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .temp-main {
      font-size: 5.5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 4px;
      transition: opacity 0.2s;
    }

    .temp-unit {
      font-size: 2rem;
      font-weight: 400;
      vertical-align: super;
      margin-left: 4px;
    }

    .hi-lo {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 20px 0 32px;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.65);
    }

    .hi-lo span strong {
      color: #fff;
      font-weight: 600;
    }

    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      padding: 10px 22px;
      cursor: pointer;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
      user-select: none;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .toggle-btn:active {
      transform: scale(0.96);
    }

    .toggle-indicator {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.25);
      border-radius: 50px;
      overflow: hidden;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .toggle-indicator span {
      padding: 3px 9px;
      border-radius: 50px;
      transition: background 0.2s, color 0.2s;
    }

    .toggle-indicator span.active {
      background: #fff;
      color: #0f3460;
    }

    @media (max-width: 400px) {
      .card { padding: 32px 24px; }
      .temp-main { font-size: 4.5rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="city" id="city">San Francisco</div>
    <div class="date" id="date"></div>
    <span class="condition-emoji" id="emoji">☀️</span>
    <div class="condition-label" id="condition">Sunny</div>
    <div class="temp-main" id="temp">
      22<span class="temp-unit">°C</span>
    </div>
    <div class="hi-lo">
      <span>H: <strong id="hi">26°C</strong></span>
      <span>L: <strong id="lo">15°C</strong></span>
    </div>
    <button class="toggle-btn" id="toggleBtn" aria-label="Switch temperature unit">
      Switch to
      <span class="toggle-indicator">
        <span id="indC" class="active">°C</span>
        <span id="indF">°F</span>
      </span>
    </button>
  </div>

  <script>
    const DATA = {
      city: 'San Francisco',
      condition: 'Sunny',
      emoji: '☀️',
      tempC: 22,
      hiC: 26,
      loC: 15,
    };

    const toF = c => Math.round(c * 9 / 5 + 32);

    let isCelsius = true;

    function formatDate() {
      return new Date().toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric'
      });
    }

    function render() {
      const unit = isCelsius ? '°C' : '°F';
      const temp  = isCelsius ? DATA.tempC : toF(DATA.tempC);
      const hi    = isCelsius ? DATA.hiC   : toF(DATA.hiC);
      const lo    = isCelsius ? DATA.loC   : toF(DATA.loC);

      document.getElementById('temp').innerHTML =
        `${temp}<span class="temp-unit">${unit}</span>`;
      document.getElementById('hi').textContent = `${hi}${unit}`;
      document.getElementById('lo').textContent = `${lo}${unit}`;

      document.getElementById('indC').classList.toggle('active',  isCelsius);
      document.getElementById('indF').classList.toggle('active', !isCelsius);
    }

    document.getElementById('city').textContent      = DATA.city;
    document.getElementById('condition').textContent = DATA.condition;
    document.getElementById('emoji').textContent     = DATA.emoji;
    document.getElementById('date').textContent      = formatDate();

    document.getElementById('toggleBtn').addEventListener('click', () => {
      isCelsius = !isCelsius;
      render();
    });

    render();
  </script>
</body>
</html>
