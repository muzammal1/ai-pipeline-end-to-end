<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: 320px;
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      text-align: right;
      overflow: hidden;
    }

    .display .expression {
      color: #a8b2d8;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display .current {
      color: #e2e8f0;
      font-size: 36px;
      font-weight: 300;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 500;
      padding: 18px 0;
      cursor: pointer;
      transition: transform 0.08s, filter 0.08s;
      user-select: none;
    }

    button:active { transform: scale(0.93); filter: brightness(0.85); }

    .btn-digit {
      background: #1a1a4e;
      color: #e2e8f0;
    }

    .btn-operator {
      background: #e94560;
      color: #fff;
    }

    .btn-clear {
      background: #533483;
      color: #fff;
    }

    .btn-equals {
      background: #e94560;
      color: #fff;
      grid-column: span 2;
    }

    .btn-zero { grid-column: span 2; }

    @media (max-width: 375px) {
      .calculator { width: 100%; border-radius: 0; padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" data-action="clear">C</button>
      <button class="btn-operator" data-action="sign">+/-</button>
      <button class="btn-operator" data-action="percent">%</button>
      <button class="btn-operator" data-op="/">÷</button>

      <button class="btn-digit" data-digit="7">7</button>
      <button class="btn-digit" data-digit="8">8</button>
      <button class="btn-digit" data-digit="9">9</button>
      <button class="btn-operator" data-op="*">×</button>

      <button class="btn-digit" data-digit="4">4</button>
      <button class="btn-digit" data-digit="5">5</button>
      <button class="btn-digit" data-digit="6">6</button>
      <button class="btn-operator" data-op="-">−</button>

      <button class="btn-digit" data-digit="1">1</button>
      <button class="btn-digit" data-digit="2">2</button>
      <button class="btn-digit" data-digit="3">3</button>
      <button class="btn-operator" data-op="+">+</button>

      <button class="btn-digit btn-zero" data-digit="0">0</button>
      <button class="btn-digit" data-digit=".">.</button>
      <button class="btn-equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const currentEl = document.getElementById('current');
    const expressionEl = document.getElementById('expression');

    let state = {
      display: '0',
      operand: null,
      operator: null,
      waitingForOperand: false,
    };

    function updateDisplay() {
      currentEl.textContent = state.display;
      if (state.operator && state.operand !== null) {
        const opSymbol = { '+': '+', '-': '−', '*': '×', '/': '÷' }[state.operator];
        expressionEl.textContent = `${formatNum(state.operand)} ${opSymbol}`;
      } else {
        expressionEl.textContent = '';
      }
    }

    function formatNum(n) {
      const s = String(n);
      return s.length > 12 ? parseFloat(n.toPrecision(10)).toString() : s;
    }

    function inputDigit(digit) {
      if (state.waitingForOperand) {
        state.display = digit === '.' ? '0.' : digit;
        state.waitingForOperand = false;
      } else {
        if (digit === '.' && state.display.includes('.')) return;
        state.display = state.display === '0' && digit !== '.' ? digit : state.display + digit;
      }
      if (state.display.length > 12) return;
      updateDisplay();
    }

    function chooseOperator(op) {
      const current = parseFloat(state.display);
      if (state.operand !== null && !state.waitingForOperand) {
        const result = calculate(state.operand, current, state.operator);
        state.display = formatNum(result);
        state.operand = result;
      } else {
        state.operand = current;
      }
      state.operator = op;
      state.waitingForOperand = true;
      updateDisplay();
    }

    function calculate(a, b, op) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? 'Error' : a / b;
      }
    }

    function equals() {
      if (state.operator === null || state.operand === null) return;
      const current = parseFloat(state.display);
      const result = calculate(state.operand, current, state.operator);
      expressionEl.textContent = `${formatNum(state.operand)} ${{ '+': '+', '-': '−', '*': '×', '/': '÷' }[state.operator]} ${formatNum(current)} =`;
      state.display = result === 'Error' ? 'Error' : formatNum(result);
      state.operand = null;
      state.operator = null;
      state.waitingForOperand = true;
      currentEl.textContent = state.display;
    }

    function clear() {
      state = { display: '0', operand: null, operator: null, waitingForOperand: false };
      updateDisplay();
    }

    document.querySelector('.buttons').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn.dataset.digit !== undefined) {
        inputDigit(btn.dataset.digit);
      } else if (btn.dataset.op) {
        chooseOperator(btn.dataset.op);
      } else if (btn.dataset.action === 'equals') {
        equals();
      } else if (btn.dataset.action === 'clear') {
        clear();
      } else if (btn.dataset.action === 'sign') {
        state.display = String(parseFloat(state.display) * -1);
        updateDisplay();
      } else if (btn.dataset.action === 'percent') {
        state.display = String(parseFloat(state.display) / 100);
        updateDisplay();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
      else if (e.key === '.') inputDigit('.');
      else if (e.key === '+') chooseOperator('+');
      else if (e.key === '-') chooseOperator('-');
      else if (e.key === '*') chooseOperator('*');
      else if (e.key === '/') { e.preventDefault(); chooseOperator('/'); }
      else if (e.key === 'Enter' || e.key === '=') equals();
      else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') clear();
      else if (e.key === 'Backspace') {
        if (state.display.length > 1) state.display = state.display.slice(0, -1);
        else state.display = '0';
        updateDisplay();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
