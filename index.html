<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #todo-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    #todo-input:focus { border-color: #4f6ef7; }

    #add-btn {
      padding: 10px 18px;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    #add-btn:hover { background: #3a56d4; }
    #add-btn:active { background: #2e45b8; }

    .count {
      font-size: 0.875rem;
      color: #888;
      margin-bottom: 12px;
      min-height: 1.2em;
    }

    #todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .todo-item:hover { background: #f7f8fc; }

    .todo-item + .todo-item { border-top: 1px solid #f0f0f0; }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f6ef7;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #333;
      word-break: break-word;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      color: #ccc;
      font-size: 1.1rem;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #e53e3e; background: #fff0f0; }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.95rem;
      padding: 24px 0 8px;
    }

    @media (max-width: 375px) {
      .card { padding: 20px 12px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Todos</h1>
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="Add a new todo..." maxlength="200" aria-label="New todo text" />
      <button id="add-btn" aria-label="Add todo">Add</button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <ul id="todo-list" aria-label="Todo list"></ul>
  </div>

  <script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const countEl = document.getElementById('count');

    let todos = [];
    let nextId = 1;

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: nextId++, text, done: false });
      input.value = '';
      render();
      input.focus();
    }

    function toggleTodo(id) {
      todos = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      render();
    }

    function render() {
      const remaining = todos.filter(t => !t.done).length;
      countEl.textContent = todos.length === 0
        ? ''
        : `${remaining} item${remaining !== 1 ? 's' : ''} remaining`;

      if (todos.length === 0) {
        list.innerHTML = '<li class="empty">No todos yet. Add one above!</li>';
        return;
      }

      list.innerHTML = todos.map(t => `
        <li class="todo-item${t.done ? ' done' : ''}" data-id="${t.id}">
          <input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Mark complete" />
          <span class="todo-text">${escHtml(t.text)}</span>
          <button class="delete-btn" aria-label="Delete todo">&#x2715;</button>
        </li>
      `).join('');

      list.querySelectorAll('.todo-item').forEach(li => {
        const id = Number(li.dataset.id);
        li.querySelector('input[type="checkbox"]').addEventListener('change', () => toggleTodo(id));
        li.querySelector('.delete-btn').addEventListener('click', () => deleteTodo(id));
      });
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

    render();
  </script>
</body>
</html>
