<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Card</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 36px 32px 32px;
      width: 100%;
      max-width: 380px;
      min-width: 0;
      color: #fff;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .city {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .date {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 4px;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .toggle-btn:active {
      transform: scale(0.96);
    }

    .main-weather {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .temperature {
      font-size: 5.5rem;
      font-weight: 200;
      line-height: 1;
      letter-spacing: -3px;
      transition: opacity 0.25s;
    }

    .temperature.changing {
      opacity: 0;
    }

    .temp-unit {
      font-size: 2.4rem;
      font-weight: 300;
      vertical-align: super;
      margin-left: 2px;
    }

    .weather-icon {
      font-size: 5.5rem;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    }

    .condition {
      font-size: 1.15rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      margin-bottom: 24px;
    }

    .hi-lo {
      display: flex;
      justify-content: space-around;
      text-align: center;
      gap: 16px;
    }

    .hi-lo-item {
      flex: 1;
    }

    .hi-lo-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 6px;
    }

    .hi-lo-value {
      font-size: 1.5rem;
      font-weight: 600;
      transition: opacity 0.25s;
    }

    .hi-lo-value.changing {
      opacity: 0;
    }

    .hi-value { color: #ff9f67; }
    .lo-value { color: #67c5ff; }

    @media (max-width: 400px) {
      .card {
        padding: 28px 20px 24px;
      }
      .temperature {
        font-size: 4.5rem;
      }
      .weather-icon {
        font-size: 4.5rem;
      }
      .city {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div>
        <div class="city" id="city-name">San Francisco</div>
        <div class="date" id="current-date"></div>
      </div>
      <button class="toggle-btn" id="toggle-btn" onclick="toggleUnit()">Switch to °F</button>
    </div>

    <div class="main-weather">
      <div class="temperature" id="main-temp">
        <span id="temp-value">22</span><span class="temp-unit">°C</span>
      </div>
      <div class="weather-icon" id="weather-icon">☀️</div>
    </div>

    <div class="condition" id="condition-text">Sunny</div>

    <div class="divider"></div>

    <div class="hi-lo">
      <div class="hi-lo-item">
        <div class="hi-lo-label">High</div>
        <div class="hi-lo-value hi-value" id="hi-value">26°</div>
      </div>
      <div class="hi-lo-item">
        <div class="hi-lo-label">Low</div>
        <div class="hi-lo-value lo-value" id="lo-value">15°</div>
      </div>
    </div>
  </div>

  <script>
    const weatherData = {
      city: 'San Francisco',
      condition: 'Sunny',
      icon: '☀️',
      tempC: 22,
      highC: 26,
      lowC: 15,
    };

    let isCelsius = true;

    function toF(c) {
      return Math.round(c * 9 / 5 + 32);
    }

    function formatDate() {
      const now = new Date();
      return now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
      });
    }

    function animateChange(ids, callback) {
      ids.forEach(id => document.getElementById(id).classList.add('changing'));
      setTimeout(() => {
        callback();
        ids.forEach(id => document.getElementById(id).classList.remove('changing'));
      }, 200);
    }

    function toggleUnit() {
      animateChange(['main-temp', 'hi-value', 'lo-value'], () => {
        isCelsius = !isCelsius;
        updateDisplay();
      });
    }

    function updateDisplay() {
      const unit = isCelsius ? 'C' : 'F';
      const temp   = isCelsius ? weatherData.tempC : toF(weatherData.tempC);
      const high   = isCelsius ? weatherData.highC  : toF(weatherData.highC);
      const low    = isCelsius ? weatherData.lowC   : toF(weatherData.lowC);

      document.querySelector('.temp-unit').textContent = `°${unit}`;
      document.getElementById('temp-value').textContent = temp;
      document.getElementById('hi-value').textContent = `${high}°`;
      document.getElementById('lo-value').textContent = `${low}°`;

      document.getElementById('toggle-btn').textContent =
        isCelsius ? 'Switch to °F' : 'Switch to °C';
    }

    document.getElementById('city-name').textContent   = weatherData.city;
    document.getElementById('weather-icon').textContent = weatherData.icon;
    document.getElementById('condition-text').textContent = weatherData.condition;
    document.getElementById('current-date').textContent  = formatDate();
    updateDisplay();
  </script>
</body>
</html>
