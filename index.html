<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 520px;
      padding: 32px 28px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #todo-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      color: #1a1a2e;
      transition: border-color 0.2s;
      outline: none;
    }

    #todo-input:focus { border-color: #6366f1; }

    #add-btn {
      padding: 10px 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    #add-btn:hover { background: #4f46e5; }
    #add-btn:active { background: #4338ca; }

    .count {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    .count span { font-weight: 700; color: #1a1a2e; }

    #todo-list {
      list-style: none;
    }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #f8fafc;
      margin-bottom: 10px;
      transition: background 0.15s;
    }

    #todo-list li:last-child { margin-bottom: 0; }
    #todo-list li:hover { background: #f1f5f9; }

    .todo-checkbox {
      width: 20px;
      height: 20px;
      accent-color: #6366f1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #1a1a2e;
      word-break: break-word;
      transition: color 0.2s;
    }

    li.done .todo-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #ef4444; background: #fee2e2; }

    .empty {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      padding: 24px 0;
    }

    @media (max-width: 375px) {
      .card { padding: 24px 16px; }
      h1 { font-size: 1.3rem; }
      #add-btn { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Todo List</h1>

    <div class="input-row">
      <input
        id="todo-input"
        type="text"
        placeholder="Add a new todo…"
        maxlength="200"
        autocomplete="off"
      />
      <button id="add-btn">Add</button>
    </div>

    <p class="count"><span id="remaining">0</span> item(s) remaining</p>

    <ul id="todo-list"></ul>
  </div>

  <script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const remainingEl = document.getElementById('remaining');

    let todos = [];

    function updateCount() {
      const n = todos.filter(t => !t.done).length;
      remainingEl.textContent = n;
    }

    function render() {
      list.innerHTML = '';

      if (todos.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.style.listStyle = 'none';
        empty.textContent = 'No todos yet. Add one above!';
        list.appendChild(empty);
        updateCount();
        return;
      }

      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        if (todo.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'todo-checkbox';
        checkbox.checked = todo.done;
        checkbox.setAttribute('aria-label', 'Mark complete');
        checkbox.addEventListener('change', () => {
          todos[index].done = checkbox.checked;
          render();
        });

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.setAttribute('aria-label', 'Delete todo');
        delBtn.addEventListener('click', () => {
          todos.splice(index, 1);
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        list.appendChild(li);
      });

      updateCount();
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = '';
      input.focus();
      render();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    render();
  </script>
</body>
</html>
